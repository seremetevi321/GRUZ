services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: escrow
      POSTGRES_USER: escrow
      POSTGRES_PASSWORD: ${DB_PASSWORD:-escrow-local-only}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escrow -d escrow"]
      interval: 2s
      retries: 30
    # Порт базы наружу не публикуется: к ней ходит только API.

  api:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql+psycopg://escrow:${DB_PASSWORD:-escrow-local-only}@db:5432/escrow
      DEMO_MODE: "1"
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo2026}
    # Слушаем только localhost этой машины: снаружи сервер недоступен.
    ports: ["127.0.0.1:8000:8000"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  dbdata:
